name: moodmap
description: "An offline-first journaling app that uses AI to analyze daily entries, generating weekly insights and personalized mood gradients."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  go_router: ^17.1.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  lottie: ^3.3.2
  pretty_animated_buttons: ^0.0.2
  smooth_page_indicator: ^2.0.1
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: "Inter"
      fonts:
       - asset: "assets/fonts/Inter.ttf"
    - family: "PlayfairDisplay"
      fonts:
       - asset: "assets/fonts/PlayfairDisplay.ttf"

  assets:
    - "assets/native_splash_light.png"
    - "assets/native_splash_dark.png"
    - "assets/intro_logo/moodmap_logo_light.json"
    - "assets/intro_logo/moodmap_logo_dark.json"
    - "assets/onb_screen_assets/onb_asset1.json"
    - "assets/onb_screen_assets/onb_asset2_1.json"
    - "assets/onb_screen_assets/onb_asset2_2.json"
    - "assets/onb_screen_assets/onb_asset3.json"
    - "assets/auth_google/google.png"
