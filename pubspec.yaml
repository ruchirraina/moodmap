name: moodmap
description: "A cross-platform journal app for logging entries, attaching music, and generating AI mood maps."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  lottie: ^3.5.1
  flutter_native_splash: ^2.4.8
  smooth_page_indicator: ^2.0.1
  go_router: ^17.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  flutter_spinkit: ^5.2.2
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/google_fonts/Lato-Regular.ttf
        - asset: assets/google_fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/google_fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Lato-Italic.ttf
          style: italic
    - family: Playfair Display
      fonts:
        - asset: assets/google_fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/google_fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlayfairDisplay-Black.ttf
          weight: 900
        - asset: assets/google_fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600